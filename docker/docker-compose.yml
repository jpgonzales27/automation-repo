services:
  postgres:
    image: postgres:18
    container_name: petclinic-db
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - petclinic-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic_user -d petclinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  petclinic-api:
    image: springcommunity/spring-petclinic-rest
    container_name: petclinic-api
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: postgres,spring-data-jpa
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/petclinic
      SPRING_DATASOURCE_USERNAME: petclinic_user
      SPRING_DATASOURCE_PASSWORD: changeme
    ports:
      - "9966:9966"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9966' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  petclinic-ui:
    image: j3r3my84/spring-petclinic-angular:latest
    container_name: petclinic-ui
    depends_on:
      petclinic-api:
        condition: service_healthy
    environment:
      # Esta URL la usa el NAVEGADOR (no el contenedor de la UI).
      # El navegador de Playwright corre dentro del contenedor "framework",
      # donde "petclinic-api" se resuelve por el DNS de la red de Docker.
      # Para abrir la UI desde tu navegador local, agrega en el archivo hosts:
      #   127.0.0.1 petclinic-api
      REST_API_URL: http://petclinic-api:9966/petclinic/api/
    ports:
      - "8080:8080"

  framework:
    build:
      context: ..            # El Dockerfile y el código del framework están en la carpeta padre
      dockerfile: Dockerfile
    image: qa-framework:latest
    container_name: qa-framework
    depends_on:
      petclinic-api:
        condition: service_healthy
      petclinic-ui:
        condition: service_started
    environment:
      BASE_URL: http://petclinic-ui:8080/
      API_BASE_URL: http://petclinic-api:9966/petclinic/api
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: petclinic
      DB_USER: petclinic_user
      DB_PASSWORD: changeme
    volumes:
      - ../allure-results:/app/allure-results

volumes:
  petclinic-data:
